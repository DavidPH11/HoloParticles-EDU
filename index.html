<!-- ============================================================
    AUDIO — sonidos click y transicion (CORREGIDO)
    ============================================================ -->
<script>
(() => {
  const CLICK_FILE      = 'click.mp3';
  const TRANSICION_FILE = 'transicion.mp3';

  /* ============================================================
     1 · SOUNDS
     ============================================================ */
  const clickSound = new Audio(CLICK_FILE);
  clickSound.volume  = 0.55;
  clickSound.preload = 'auto';

  const transicionSound = new Audio(TRANSICION_FILE);
  transicionSound.volume  = 0.65;
  transicionSound.preload = 'auto';
  transicionSound.loop    = true;

  /* ============================================================
     2 · CLICK en cualquier <button>
     ============================================================ */
  function playClick() {
    try {
      const s = clickSound.cloneNode();
      s.volume = clickSound.volume;
      s.play().catch(() => {});
    } catch (e) {}
  }

  function bindClickSounds() {
    document.querySelectorAll('button').forEach(btn => {
      if (btn.dataset.audioBound) return;
      btn.dataset.audioBound = '1';
      btn.addEventListener('click', playClick, { passive: true });
    });
  }
  bindClickSounds();
  new MutationObserver(bindClickSounds).observe(document.body, {
    childList: true, subtree: true
  });

  /* ============================================================
     3 · TRANSICION — sólo durante la intro
     ============================================================ */
  let introSoundStopped = false;
  let introSoundTimer   = null;

  function startIntroSound() {
    if (introSoundStopped) return;
    if (!transicionSound.paused) return;
    transicionSound.play().catch(() => {});
  }

  function stopIntroSound() {
    if (introSoundStopped) return;   // evita llamadas repetidas
    introSoundStopped = true;
    if (introSoundTimer) {
      clearTimeout(introSoundTimer);
      introSoundTimer = null;
    }
    try {
      transicionSound.pause();
      transicionSound.currentTime = 0;
    } catch (e) {}
  }

  // ✅ Exponer la función para que el click en el fondo pueda usarla
  window.__stopIntroSound = stopIntroSound;

  // Intento de autoplay al cargar
  startIntroSound();

  // 🛡️ Safety net: la música nunca dura más de 30 segundos
  introSoundTimer = setTimeout(stopIntroSound, 30000);

  // Fallback de autoplay (si el navegador bloqueó el sonido inicial)
  const kickIntroAudio = () => {
    startIntroSound();
    window.removeEventListener('pointerdown', kickIntroAudio);
    window.removeEventListener('keydown',      kickIntroAudio);
    window.removeEventListener('touchstart',   kickIntroAudio);
  };
  window.addEventListener('pointerdown', kickIntroAudio, { once: true });
  window.addEventListener('keydown',     kickIntroAudio, { once: true });
  window.addEventListener('touchstart',  kickIntroAudio, { once: true });

  /* ============================================================
     4 · FIN DE LA INTRO — detiene la música
     ============================================================ */
  window.addEventListener('holoIntroDone', stopIntroSound);

  /* ============================================================
     5 · PAUSA cuando la pestaña no está visible
     ============================================================ */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && !introSoundStopped) {
      try { transicionSound.pause(); } catch (e) {}
    } else if (!document.hidden && !introSoundStopped && transicionSound.paused) {
      if (window.__holoIntroActive) {
        transicionSound.play().catch(() => {});
      }
    }
  });
})();
</script>
