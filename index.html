<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#01030A"/>
<title>Holo Particles EDU</title>

<!-- ===== FAVICON (múltiples formatos + cache-busting) ===== -->
<link rel="icon" type="image/svg+xml" sizes="any" href="holos.svg?v=2">
<link rel="shortcut icon" href="holos.svg?v=2">
<link rel="apple-touch-icon" href="holos.svg?v=2">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
--hl:      #8CC8FF;
--mid:     #3778D2;
--dark:    #193C82;
--edge:    #081432;
--deep:    #000206;
--paper:   #dfe9f5;
--ink:     #c8d8ec;
--muted:   #6d87ab;
--stroke:  rgba(140, 200, 255, 0.14);
--stroke-2:rgba(140, 200, 255, 0.32);
}

*{box-sizing:border-box}
html, body{
margin:0; padding:0;
width:100%; height:100%;
background:#01030A;
overflow:hidden;
font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
color:var(--ink);
font-size:15px;
font-weight:400;
letter-spacing:-0.005em;
-webkit-font-smoothing:antialiased;
}

#introStage{
position:fixed;
inset:0;
background:#01030A;
overflow:hidden;
cursor:pointer;
z-index:1000;
transition:opacity 1.2s cubic-bezier(.4,0,.2,1), visibility 1.2s linear;
}
#introStage.out{
opacity:0;
visibility:hidden;
pointer-events:none;
}

#introCv{
position:absolute; inset:0;
display:block;
z-index:1;
transform:translateZ(0);
backface-visibility:hidden;
}

#introScene{
position:absolute; inset:0;
display:block;
z-index:2;
opacity:0;
pointer-events:none;
transition:opacity 2.5s ease;
transform:translateZ(0);
backface-visibility:hidden;
}
#introScene.show{ opacity:1; }

#heroContent{
position:absolute;
top:50%; left:50%;
transform:translate(-50%, -50%);
z-index:10;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
gap:22px;
width:min(760px, 88vw);
opacity:0;
pointer-events:none;
transition:opacity 1.4s ease;
}
#heroContent::before{
content:'';
position:absolute;
top:50%; left:50%;
transform:translate(-50%, -50%);
width:145%; height:260%;
background:radial-gradient(
    ellipse at center,
    rgba(1,3,10,0.78) 0%,
    rgba(1,3,10,0.62) 30%,
    rgba(1,3,10,0.32) 55%,
    rgba(1,3,10,0) 78%
);
z-index:-1;
pointer-events:none;
filter:blur(10px);
}
#heroContent.show{
opacity:1;
pointer-events:auto;
}
#heroContent h1{
margin:0;
font-size:clamp(2.2rem, 6vw, 4.4rem);
font-weight:800;
letter-spacing:-0.03em;
line-height:1.02;
color:#FFFFFF;
text-shadow:
    0 0 8px rgba(0,0,0,0.85),
    0 0 20px rgba(0,0,0,0.65),
    0 2px 24px rgba(0,0,0,0.75),
    0 0 40px rgba(120,205,255,0.30);
}
#heroContent p{
margin:0;
max-width:620px;
font-size:clamp(0.92rem, 1.1vw, 1.05rem);
font-weight:500;
line-height:1.55;
letter-spacing:0.005em;
color:rgba(234, 246, 255, 0.96);
text-shadow:
    0 0 6px rgba(0,0,0,0.85),
    0 0 16px rgba(0,0,0,0.70),
    0 1px 12px rgba(0,0,0,0.80);
}
#enterBtn{
display:inline-flex;
align-items:center;
justify-content:center;
gap:10px;
margin-top:8px;
padding:18px 34px;
border:none;
border-radius:999px;
background:#FFFFFF;
color:#0A0A0A;
font-size:1rem;
font-weight:500;
letter-spacing:-0.005em;
line-height:1;
white-space:nowrap;
cursor:pointer;
box-shadow:
    0 4px 14px rgba(0,0,0,0.35),
    0 0 0 rgba(120,205,255,0);
transition:
    transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2),
    box-shadow 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2),
    background 0.3s ease;
}
#enterBtn svg{
display:block;
transition:transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}
#enterBtn:hover{
transform:translateY(-6px);
box-shadow:
    0 14px 34px rgba(0,0,0,0.55),
    0 0 38px rgba(120,205,255,0.55),
    0 0 0 2px rgba(120,205,255,0.28);
}
#enterBtn:hover svg{ transform:translateX(4px); }
#enterBtn:active{
transform:translateY(-2px) scale(0.985);
box-shadow:
    0 6px 18px rgba(0,0,0,0.45),
    0 0 22px rgba(120,205,255,0.40),
    0 0 0 2px rgba(120,205,255,0.28);
transition:transform 0.10s ease, box-shadow 0.10s ease;
}
#enterBtn:focus-visible{
outline:2px solid rgba(120,205,255,0.9);
outline-offset:3px;
}

#mainApp{
position:fixed;
inset:0;
opacity:0;
pointer-events:none;
transition:opacity 1.2s cubic-bezier(.4,0,.2,1);
overflow:hidden;
}
#mainApp.in{
opacity:1;
pointer-events:auto;
}

#starsBg{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:0;
pointer-events:none;
background:radial-gradient(ellipse at 20% 15%, #04091a 0%, #000206 55%, #000000 100%);
}

#auroraBg{
position:fixed;
inset:0;
width:100%;
height:100%;
z-index:0;
pointer-events:none;
mix-blend-mode:screen;
opacity:.9;
}

header, main{position:relative; z-index:1}

header{
padding:32px 42px 22px;
display:flex;
justify-content:space-between;
align-items:center;
gap:22px;
flex-wrap:wrap;
border-bottom:1px solid var(--stroke);
background:linear-gradient(180deg, rgba(2,6,16,.85), rgba(0,2,6,.45));
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
}
.brand{display:flex;flex-direction:column;gap:6px}
.brand h1{
margin:0;
font-weight:600;
font-size:clamp(36px, 5.8vw, 68px);
line-height:1;
letter-spacing:-0.04em;
color:#5a7a9a;
text-shadow:0 0 40px rgba(90,122,154,.20);
}
.brand .subtitle{
display:flex;
align-items:center;
gap:14px;
font-weight:500;
font-size:11px;
letter-spacing:.38em;
text-transform:uppercase;
color:var(--muted);
padding-left:2px;
}
.brand .subtitle::before,
.brand .subtitle::after{
content:"";
height:1px;
background:var(--stroke);
flex:1 1 auto;
min-width:24px;
max-width:70px;
}
.brand p{
margin:8px 0 0;
font-weight:300;
color:var(--muted);
font-size:15px;
letter-spacing:-0.005em;
}
.badge{
padding:11px 20px;
border:1px solid var(--stroke-2);
border-radius:4px;
background:rgba(2, 8, 22, 0.70);
color:var(--hl);
font-weight:600;
font-size:10px;
letter-spacing:.30em;
text-transform:uppercase;
white-space:nowrap;
box-shadow:0 0 22px rgba(140,200,255,.06) inset, 0 0 14px rgba(55,120,210,.06);
}

main{
display:grid;
grid-template-columns:minmax(0,1fr) 360px;
gap:22px;
padding:22px 42px 42px;
}

.stage{
position:relative;
border:1px solid var(--stroke);
border-radius:6px;
overflow:hidden;
background:#000205;
min-height:620px;
box-shadow:
    0 0 0 1px rgba(140,200,255,.03),
    0 30px 80px rgba(0,0,0,.85),
    0 0 80px rgba(25,60,130,.14) inset;
}
.stage::before{
content:"";
position:absolute;
inset:8px;
border:1px solid rgba(140,200,255,.07);
border-radius:3px;
pointer-events:none;
z-index:2;
}
.stage canvas{
display:block;
width:100%;
height:620px;
position:relative;
z-index:1;
}

.cameraBox{
position:absolute;
right:18px; top:18px;
width:220px;
border-radius:4px;
overflow:hidden;
border:1px solid var(--stroke-2);
background:#000206;
box-shadow:0 12px 30px rgba(0,0,0,.85), 0 0 20px rgba(55,120,210,.14);
z-index:3;
}
.cameraBox video{
width:100%;
display:block;
transform:scaleX(-1);
filter:hue-rotate(-25deg) saturate(.80) brightness(.82) contrast(1.05);
transition:transform .35s ease;
backface-visibility:hidden;
}
.cameraBox video.noMirror{
transform:scaleX(1);
}
.cameraLabel{
padding:9px 12px;
font-weight:600;
font-size:10px;
letter-spacing:.30em;
text-transform:uppercase;
color:var(--muted);
background:rgba(2,6,16,.92);
border-top:1px solid var(--stroke);
text-align:center;
}

.hint{
position:absolute;
left:20px; bottom:20px;
padding:14px 18px;
border-radius:4px;
background:rgba(0,2,8,.88);
border:1px solid var(--stroke);
color:var(--ink);
font-weight:400;
font-size:13.5px;
max-width:560px;
line-height:1.55;
letter-spacing:-0.005em;
z-index:3;
backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);
}
.hint b{
font-weight:600;
letter-spacing:.01em;
color:var(--hl);
}

.panel{
background:linear-gradient(180deg, rgba(4,10,24,.80), rgba(0,2,8,.88));
border:1px solid var(--stroke);
border-radius:6px;
padding:24px 22px;
box-shadow:
    0 30px 80px rgba(0,0,0,.75),
    0 0 50px rgba(25,60,130,.10) inset;
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
height:fit-content;
position:sticky;
top:22px;
}
.panel h2{
margin:0 0 16px;
font-weight:600;
font-size:15px;
letter-spacing:.28em;
text-transform:uppercase;
color:var(--paper);
padding-bottom:12px;
border-bottom:1px solid var(--stroke);
}
.status{
padding:12px 14px;
border-radius:4px;
background:rgba(2,8,20,.75);
border:1px solid var(--stroke);
color:var(--hl);
font-weight:400;
margin-bottom:16px;
font-size:13px;
line-height:1.5;
letter-spacing:-0.005em;
}
.group{margin:20px 0}
.group label{
display:block;
color:var(--muted);
font-size:10px;
font-weight:600;
letter-spacing:.28em;
text-transform:uppercase;
margin-bottom:10px;
}
.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}
.buttons.three{
grid-template-columns:1.6fr .7fr 1fr;
}
.btn{
border:1px solid var(--stroke);
background:rgba(2,10,26,.70);
color:var(--paper);
padding:12px 12px;
border-radius:4px;
font-weight:600;
font-size:11px;
letter-spacing:.16em;
text-transform:uppercase;
cursor:pointer;
transition:background .25s ease, border-color .25s ease, color .25s ease, box-shadow .25s ease;
}
.btn:hover{
background:rgba(12,32,64,.90);
border-color:var(--stroke-2);
color:#ffffff;
}
.btn.primary{
background:linear-gradient(135deg, var(--edge), var(--dark));
border:1px solid var(--stroke-2);
color:#ffffff;
box-shadow:0 0 24px rgba(55,120,210,.22);
}
.btn.primary:hover{
background:linear-gradient(135deg, var(--dark), var(--mid));
color:#ffffff;
}
.btn.danger{
background:rgba(28,8,18,.80);
border-color:rgba(255,130,150,.28);
color:#ffb9c6;
}
.btn.danger:hover{
background:rgba(48,14,28,.90);
border-color:#ff8296;
}
.btn.active{
outline:1px solid var(--hl);
outline-offset:-1px;
background:rgba(15,42,92,.90);
color:#ffffff;
box-shadow:0 0 18px rgba(140,200,255,.20);
}
.btn:disabled{
opacity:.45;
cursor:not-allowed;
}
#flipBtn{
font-size:16px;
padding:10px 8px;
letter-spacing:0;
font-weight:700;
display:flex;
align-items:center;
justify-content:center;
}
#flipBtn svg{
width:18px;height:18px;
transition:transform .5s cubic-bezier(.4,0,.2,1);
}
#flipBtn.spinning svg{
transform:rotate(180deg);
}
.range{
width:100%;
-webkit-appearance:none;
appearance:none;
height:3px;
background:linear-gradient(90deg, var(--edge), var(--mid));
border-radius:2px;
outline:none;
margin-top:4px;
}
.range::-webkit-slider-thumb{
-webkit-appearance:none;
appearance:none;
width:14px;height:14px;
background:var(--hl);
border-radius:50%;
cursor:pointer;
box-shadow:0 0 12px rgba(140,200,255,.75);
border:2px solid #000206;
}
.range::-moz-range-thumb{
width:12px;height:12px;
background:var(--hl);
border-radius:50%;
cursor:pointer;
border:2px solid #000206;
box-shadow:0 0 12px rgba(140,200,255,.75);
}
.metrics{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
.metric{
padding:12px 14px;
border-radius:4px;
background:rgba(2,8,20,.65);
border:1px solid var(--stroke);
font-size:9.5px;
font-weight:600;
letter-spacing:.24em;
text-transform:uppercase;
color:var(--muted);
}
.metric b{
display:block;
font-size:21px;
font-weight:600;
margin-top:7px;
letter-spacing:-0.02em;
color:var(--hl);
text-transform:none;
}
.legend{
font-size:13px;
color:var(--ink);
line-height:2;
font-weight:400;
padding-top:8px;
border-top:1px solid var(--stroke);
margin-top:22px;
}
.dot{
display:inline-block;
width:9px;height:9px;
border-radius:50%;
margin-right:10px;
vertical-align:middle;
box-shadow:0 0 10px currentColor;
}
.foot{
font-size:11.5px;
color:var(--muted);
margin-top:22px;
line-height:1.65;
font-weight:400;
padding-top:16px;
border-top:1px solid var(--stroke);
}

@media(max-width:1100px){
main{grid-template-columns:1fr;padding:20px 22px 34px}
.panel{order:-1;position:static}
.stage,.stage canvas{min-height:540px;height:540px}
.cameraBox{width:170px}
header{padding:26px 24px 18px}
}
@media(max-width:520px){
.brand h1{font-size:clamp(28px, 10vw, 46px)}
.brand .subtitle{font-size:10px;letter-spacing:.26em}
.hint{font-size:12px;padding:10px 14px;left:14px;right:14px;bottom:14px;max-width:none}
.cameraBox{width:140px;right:14px;top:14px}
}

#mainApp{
display:flex;
flex-direction:column;
width:100%;
height:100dvh;
min-height:100dvh;
overflow:auto;
}

#mainApp > main{
flex:1 1 auto;
min-height:0;
overflow:auto;
}

@media (min-width:1101px){
#mainApp > main{
    height:auto;
    min-height:0;
    grid-template-rows:minmax(0,1fr);
    align-items:stretch;
    padding-top:18px;
    padding-bottom:28px;
}
#mainApp .stage{min-height:0;height:100%}
#mainApp .stage canvas{min-height:0;height:100%}
#mainApp .panel{position:relative;top:auto;min-height:0;max-height:100%;overflow:auto}
}
</style>
</head>
